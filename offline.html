<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B2E1B">
  <title>CampusShield is offline</title>
  <style>
    :root{color-scheme:light;--ink:#142536;--muted:#64748B;--line:#E2E8F0;--green:#0F766E}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:#F4F7FA;color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(100%,480px);padding:clamp(24px,6vw,42px);border:1px solid var(--line);border-radius:22px;background:#fff;box-shadow:0 18px 44px #0B1F3310}
    .mark{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:#0B1F33;color:#14B8A6;font-weight:900;letter-spacing:-.06em}
    h1{margin:24px 0 8px;font-size:clamp(27px,7vw,36px);line-height:1.15;letter-spacing:-.05em}
    p{color:var(--muted);font-size:14px}
    .notice{margin-top:24px;padding:14px;border:1px solid #f0dfbd;border-radius:12px;background:#fffaf0;color:#705622;font-size:12px}
    a{display:inline-flex;margin-top:13px;padding:10px 14px;border-radius:10px;background:var(--green);color:#fff;text-decoration:none;font-size:13px;font-weight:750}
  </style>
  <link rel="stylesheet" href="./campusshield-brand-system.css">
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">CS</div>
    <h1>You’re offline</h1>
    <p>CampusShield needs an internet connection to sign in and load or submit reports. No incident reports or sign-in details are saved for offline use.</p>
    <a href="./">Try again</a>
    <div class="notice">CampusShield is a prototype and does not contact emergency services.</div>
  </main>
</body>
</html>
