<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102b35">
  <title>CampusShield is offline</title>
  <style>
    :root{color-scheme:light;--ink:#17313a;--muted:#71828a;--line:#e2eae6;--teal:#187b61}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:#f4f7f5;color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(100%,480px);padding:clamp(24px,6vw,42px);border:1px solid var(--line);border-radius:22px;background:#fff;box-shadow:0 18px 44px #12313a0e}
    .mark{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:#102b35;color:#79e0c4;font-weight:900;letter-spacing:-.06em}
    h1{margin:24px 0 8px;font-size:clamp(27px,7vw,36px);line-height:1.15;letter-spacing:-.05em}
    p{color:var(--muted);font-size:14px}
    .notice{margin-top:24px;padding:14px;border:1px solid #f0dfbd;border-radius:12px;background:#fffaf0;color:#705622;font-size:12px}
    a{display:inline-flex;margin-top:13px;padding:10px 14px;border-radius:10px;background:var(--teal);color:#fff;text-decoration:none;font-size:13px;font-weight:750}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">CS</div>
    <h1>You’re offline</h1>
    <p>CampusShield needs an internet connection to sign in and load or submit reports. No incident reports or sign-in details are saved for offline use.</p>
    <a href="./">Try again</a>
    <div class="notice">CampusShield is a prototype and does not contact emergency services.</div>
  </main>
</body>
</html>
