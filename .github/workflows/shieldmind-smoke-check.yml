name: ShieldMind provider error smoke check

on:
  push:
    branches:
      - codex/shieldmind-provider-rate-limit-errors
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run complete smoke suite
        run: node tests/smoke-check.mjs
