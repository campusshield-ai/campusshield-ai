name: CampusShield smoke checks

on:
  pull_request:
    branches:
      - main
      - feature/nigerian-multi-university-foundation
      - feature/identity-university-search
  push:
    branches:
      - main
      - feature/nigerian-multi-university-foundation
      - feature/identity-university-search
      - feature/onboarding-staff-governance

permissions:
  contents: read

jobs:
  smoke-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run frontend and migration smoke checks
        run: |
          node tests/smoke-check.mjs
          node tests/student-identity-smoke-check.mjs
          node tests/campus-life-smoke-check.mjs
          node tests/nuc-directory-reconciliation-smoke-check.mjs
          node tests/staff-governance-smoke-check.mjs
          node scripts/reconcile-nuc-directory.mjs
      - name: Upload live NUC roster audit
        uses: actions/upload-artifact@v4
        with:
          name: nuc-roster-audit
          path: artifacts/nuc-roster-audit/
          if-no-files-found: error
          retention-days: 14
