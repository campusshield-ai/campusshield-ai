name: CampusShield QR attendance checks

on:
  pull_request:
    branches: ["staging/preview"]
    paths:
      - "index.html"
      - "campusshield-app.js"
      - "campus-attendance.js"
      - "campus-attendance.css"
      - "tests/campus-attendance-smoke.mjs"
      - "tests/browser/campus-attendance.spec.cjs"
      - ".github/workflows/campus-attendance.yml"
  push:
    branches: ["staging/preview"]
    paths:
      - "index.html"
      - "campusshield-app.js"
      - "campus-attendance.js"
      - "campus-attendance.css"
      - "tests/campus-attendance-smoke.mjs"
      - "tests/browser/campus-attendance.spec.cjs"

permissions:
  contents: read

jobs:
  qr-attendance:
    name: QR attendance security and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate attendance JavaScript
        run: node --check campus-attendance.js
      - name: Run attendance integration smoke checks
        run: node tests/campus-attendance-smoke.mjs
      - name: Install Playwright
        run: npm install --no-save --no-package-lock @playwright/test@1.64.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test QR attendance flows
        env:
          CI: "true"
        run: npx playwright test tests/browser/campus-attendance.spec.cjs --config=playwright.config.cjs
