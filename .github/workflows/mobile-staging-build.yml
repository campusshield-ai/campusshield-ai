name: Mobile staging build check

on:
  push:
    branches:
      - codex/mobile-store-preparation-staging
  pull_request:
    branches:
      - codex/campuspulse-mobile-spacing-staging
    paths:
      - 'package.json'
      - 'capacitor.config.ts'
      - 'scripts/build-mobile.mjs'
      - 'supabase-config.js'
      - 'index.html'
      - 'campusshield-backend.js'
      - 'manifest.webmanifest'
      - 'offline.html'
      - 'service-worker.js'
      - 'icons/**'
      - '.github/workflows/mobile-staging-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-assets:
    name: Build staging mobile web assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install mobile tooling
        run: npm install --no-audit --no-fund
      - name: Check build script syntax
        run: node --check scripts/build-mobile.mjs
      - name: Build staging-only web assets
        run: npm run build:mobile
      - name: Verify output is staging-only
        run: |
          grep -q 'hywcpnoqqhxvujnimhxl' www/supabase-config.js
          if grep -q 'fvgtnujjnvdkhzqqcaqe' www/supabase-config.js; then
            echo 'Production Supabase ref found in mobile output; failing build.'
            exit 1
          fi
