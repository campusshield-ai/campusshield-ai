name: CampusShield launch intro checks

on:
  pull_request:
    branches: [staging/preview]
    paths:
      - "index.html"
      - "campusshield-launch-intro.css"
      - "campusshield-launch-intro.js"
      - "tests/campusshield-launch-intro-smoke.mjs"
      - "tests/browser/launch-intro.spec.cjs"
      - "playwright.config.cjs"
      - ".github/workflows/campusshield-launch-intro.yml"
  push:
    branches: [staging/preview]
    paths:
      - "index.html"
      - "campusshield-launch-intro.css"
      - "campusshield-launch-intro.js"
      - "tests/campusshield-launch-intro-smoke.mjs"
      - "tests/browser/launch-intro.spec.cjs"
      - "playwright.config.cjs"
      - ".github/workflows/campusshield-launch-intro.yml"

permissions:
  contents: read

jobs:
  launch-intro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate launch introduction
        run: node tests/campusshield-launch-intro-smoke.mjs
      - name: Install browser-test dependency
        run: npm install --no-save --no-package-lock @playwright/test@1.64.1
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Verify launch intro interaction and responsive layout
        run: npx playwright test tests/browser/launch-intro.spec.cjs --config=playwright.config.cjs
