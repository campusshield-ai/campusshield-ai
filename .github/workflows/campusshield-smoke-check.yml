name: CampusShield smoke check

on:
  push:
    branches:
      - codex/pr22-staff-role-gate-audit
  pull_request:
    branches:
      - codex/campuspulse-mobile-spacing-staging

permissions:
  contents: read

jobs:
  smoke-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run smoke checks
        run: node tests/smoke-check.mjs
