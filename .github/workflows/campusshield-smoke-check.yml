name: CampusShield staging smoke checks

on:
  pull_request:
    branches:
      - codex/shieldmind-ai-staging-implementation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check ClamAV gateway syntax
        run: node --check services/clamav-scanner/server.mjs
      - name: Run synthetic ClamAV gateway tests
        run: node services/clamav-scanner/test-gateway.mjs
      - name: Run CampusShield smoke checks
        run: node tests/smoke-check.mjs
