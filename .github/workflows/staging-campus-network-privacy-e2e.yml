name: Staging Campus Network privacy E2E

on:
  pull_request:
    branches: [main, "staging/preview"]
    paths:
      - ".github/workflows/staging-campus-network-privacy-e2e.yml"
      - "supabase/migrations/20261110200000_campus_network_privacy_and_performance.sql"
      - "tests/e2e/staging-campus-network-privacy-e2e.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: campusshield-staging-network-privacy-e2e
  cancel-in-progress: false

jobs:
  network-privacy-e2e:
    name: Reciprocal member blocks, Alumni Connect and cleanup
    if: github.repository == 'campusshield-ai/campusshield-ai' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_STAGING_URL: https://hywcpnoqqhxvujnimhxl.supabase.co
      SUPABASE_STAGING_ANON_KEY: sb_publishable_qxFnFGkyBzVvvzQ3oFsyLw_tK6HCKOP
      SUPABASE_STAGING_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_STAGING_SERVICE_ROLE_KEY }}
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate the exact Staging project
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_STAGING_URL" || { echo "::error::Staging URL is required."; exit 1; }
          test -n "$SUPABASE_STAGING_ANON_KEY" || { echo "::error::Staging publishable key is required."; exit 1; }
          test -n "$SUPABASE_STAGING_SERVICE_ROLE_KEY" || { echo "::error::Add SUPABASE_STAGING_SERVICE_ROLE_KEY for Staging only."; exit 1; }
          actual_ref="$(node -e 'const u=new URL(process.env.SUPABASE_STAGING_URL); if(u.protocol!=="https:") process.exit(2); const m=u.hostname.match(/^([a-z0-9]+)\.supabase\.co$/); if(!m) process.exit(2); process.stdout.write(m[1])')"
          if [ "$actual_ref" != "hywcpnoqqhxvujnimhxl" ]; then
            echo "::error::Refusing to run outside the approved Staging project."
            exit 1
          fi
          echo "Staging project reference verified. Credentials are not printed."

      - name: Install pinned Supabase client
        run: npm install --no-save --no-package-lock @supabase/supabase-js@2.95.0

      - name: Run authenticated Campus Network privacy matrix
        run: node tests/e2e/staging-campus-network-privacy-e2e.mjs
