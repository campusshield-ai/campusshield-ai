name: CampusShield Midnight Navy + Premium Teal brand system
on:
  pull_request:
    branches: [staging/preview, main]
    paths:
      - "campusshield-brand-system.css"
      - "index.html"
      - "about.html"
      - "features.html"
      - "help.html"
      - "privacy.html"
      - "terms.html"
      - "contact.html"
      - "offline.html"
      - "student-life-preview.html"
      - "manifest.webmanifest"
      - "service-worker.js"
      - "icons/campusshield.svg"
      - "assets/campusshield-logo.svg"
      - "scripts/generate-pwa-icons.mjs"
      - "tests/brand-system-smoke.mjs"
      - "tests/browser/shieldmind-learning-insights.spec.cjs"
      - "playwright.config.cjs"
      - ".github/workflows/brand-system.yml"
  push:
    branches: [staging/preview]
    paths:
      - "campusshield-brand-system.css"
      - "index.html"
      - "manifest.webmanifest"
      - "service-worker.js"
      - "icons/campusshield.svg"
      - "assets/campusshield-logo.svg"
      - "scripts/generate-pwa-icons.mjs"
      - "tests/brand-system-smoke.mjs"
      - ".github/workflows/brand-system.yml"
permissions:
  contents: read
jobs:
  brand-system:
    name: Brand palette, PWA metadata and page coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Midnight Navy + Premium Teal brand system
        run: node tests/brand-system-smoke.mjs
      - name: Install Playwright browser-test dependency
        run: npm install --no-save --no-package-lock @playwright/test@1.64.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify ShieldMind dark-mode gradients survive shared theme overrides
        env:
          CI: "true"
        run: npx playwright test tests/browser/shieldmind-learning-insights.spec.cjs --config=playwright.config.cjs
