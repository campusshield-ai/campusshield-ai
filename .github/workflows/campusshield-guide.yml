name: CampusShield guide checks

on:
  pull_request:
    branches: [staging/preview, main]
    paths:
      - "index.html"
      - "campusshield-app.js"
      - "campusshield-guide.js"
      - "campusshield-guide.css"
      - "help.html"
      - "tests/campusshield-guide-smoke.mjs"
      - "tests/browser/guide-walkthrough.spec.cjs"
      - ".github/workflows/campusshield-guide.yml"

permissions:
  contents: read

jobs:
  guide:
    name: Guide navigation, content and responsive checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check application JavaScript syntax
        run: node --check campusshield-app.js
      - name: Check guide JavaScript syntax
        run: node --check campusshield-guide.js
      - name: Verify in-app guide and Help Centre
        run: node tests/campusshield-guide-smoke.mjs
      - name: Install Playwright
        run: npm install --no-save --no-package-lock @playwright/test@1.64.1
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Verify guided walkthrough interaction and mobile layout
        env:
          CI: "true"
        run: npx playwright test tests/browser/guide-walkthrough.spec.cjs --config=playwright.config.cjs
