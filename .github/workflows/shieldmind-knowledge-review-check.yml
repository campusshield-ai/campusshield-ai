name: ShieldMind knowledge review gate checks

on:
  push:
    branches:
      - feat/shieldmind-knowledge-agent
  pull_request:
    branches:
      - feat/shieldmind-knowledge-agent
    paths:
      - "supabase/functions/campus-knowledge-crawler/**"
      - "campus-knowledge-admin.js"
      - "tests/shieldmind-knowledge-crawler-review-smoke.mjs"
      - "tests/smoke-check.mjs"
      - ".github/workflows/shieldmind-knowledge-review-check.yml"

permissions:
  contents: read

concurrency:
  group: shieldmind-knowledge-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crawler-typecheck-and-smoke:
    name: Deno type-check and full smoke suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check knowledge crawler
        run: deno check --no-lock supabase/functions/campus-knowledge-crawler/index.ts
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run complete smoke suite
        run: node tests/smoke-check.mjs
