name: Campus Network and discovery checks

on:
  pull_request:
    branches: [staging/preview]
    paths:
      - "index.html"
      - "campusshield-app.js"
      - "campusshield-backend.js"
      - "campusshield-visual-refresh.css"
      - "supabase/migrations/20261108010000_campus_network_hub.sql"
      - "tests/campus-network-hub-smoke.mjs"
      - "tests/e2e/staging-identity-e2e.mjs"
      - ".github/workflows/staging-identity-e2e.yml"
      - ".github/workflows/campus-network-hub.yml"
  push:
    branches: [staging/preview]
    paths:
      - "index.html"
      - "campusshield-app.js"
      - "campusshield-backend.js"
      - "campusshield-visual-refresh.css"
      - "supabase/migrations/20261108010000_campus_network_hub.sql"
      - "tests/campus-network-hub-smoke.mjs"
      - ".github/workflows/campus-network-hub.yml"

permissions:
  contents: read

jobs:
  campus-network:
    name: Campus Network syntax, privacy and full regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check app JavaScript syntax
        run: node --check campusshield-app.js
      - name: Check backend JavaScript syntax
        run: node --check campusshield-backend.js
      - name: Check Campus Network and discovery contracts
        run: node tests/campus-network-hub-smoke.mjs
      - name: Check staging authenticated E2E syntax
        run: node --check tests/e2e/staging-identity-e2e.mjs
      - name: Run full CampusShield smoke suite
        run: node tests/smoke-check.mjs
