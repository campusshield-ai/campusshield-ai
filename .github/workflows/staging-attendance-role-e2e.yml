name: Staging attendance role matrix E2E

on:
  pull_request:
    branches: [main, "staging/preview"]
    paths:
      - ".github/workflows/staging-attendance-role-e2e.yml"
      - "tests/e2e/staging-attendance-role-e2e.mjs"
      - "campus-qr-attendance.js"
      - "campusshield-backend.js"
      - "supabase/migrations/20261108115155_campus_class_qr_attendance.sql"
      - "supabase/migrations/20261108115319_deny_direct_access_to_private_attendance_qr_tokens.sql"
      - "supabase/migrations/20261108120238_campus_class_attendance_session_controls.sql"
      - "supabase/migrations/20261108132905_campus_attendance_verified_university_admin_helper.sql"
      - "supabase/migrations/20261108132924_campus_attendance_admin_and_teacher_controls.sql"
      - "supabase/migrations/20261108132926_campus_attendance_manual_adjustments_with_reason.sql"
      - "supabase/migrations/20261108132927_restrict_attendance_controls_to_verified_teachers_and_admins.sql"
      - "supabase/migrations/20261108132929_wrap_manual_attendance_rpc_as_invoker.sql"
      - "supabase/migrations/20261108132930_restrict_legacy_attendance_mark_rpc.sql"
      - "supabase/migrations/20261108133000_attendance_helper_and_trigger_function_acl.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: campusshield-staging-attendance-role-e2e
  cancel-in-progress: false

jobs:
  attendance-role-e2e:
    name: Student, lecturer and campus-admin authorization
    if: github.repository == 'campusshield-ai/campusshield-ai' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_STAGING_URL: https://hywcpnoqqhxvujnimhxl.supabase.co
      SUPABASE_STAGING_ANON_KEY: sb_publishable_qxFnFGkyBzVvvzQ3oFsyLw_tK6HCKOP
      SUPABASE_STAGING_SERVICE_ROLE_KEY: \${{ secrets.SUPABASE_STAGING_SERVICE_ROLE_KEY }}
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate the exact Staging target
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_STAGING_URL" || { echo "::error::Staging URL is required."; exit 1; }
          test -n "$SUPABASE_STAGING_ANON_KEY" || { echo "::error::Staging publishable key is required."; exit 1; }
          test -n "$SUPABASE_STAGING_SERVICE_ROLE_KEY" || { echo "::error::Add repository secret SUPABASE_STAGING_SERVICE_ROLE_KEY for the Staging project only."; exit 1; }
          actual_ref="$(node -e 'const u=new URL(process.env.SUPABASE_STAGING_URL); if(u.protocol!=="https:") process.exit(2); const m=u.hostname.match(/^([a-z0-9]+)\.supabase\.co$/); if(!m) process.exit(2); process.stdout.write(m[1])')"
          if [ "$actual_ref" != "hywcpnoqqhxvujnimhxl" ]; then
            echo "::error::Refusing to run: this workflow is restricted to the approved Staging Supabase project."
            exit 1
          fi
          echo "Staging project reference verified. Credentials are not printed."

      - name: Install pinned Supabase client
        run: npm install --no-save --no-package-lock @supabase/supabase-js@2.95.0

      - name: Run real authenticated attendance role matrix
        run: node tests/e2e/staging-attendance-role-e2e.mjs
