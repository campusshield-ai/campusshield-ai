name: Production migration candidate static review

on:
  pull_request:
    branches: [main, staging/preview]
    paths:
      - "supabase/production-candidates/**"
      - "tests/production-migration-candidate-static.mjs"
      - "tests/production-live-classroom-contract.sql"
      - ".github/workflows/production-migration-candidate-static.yml"
  push:
    branches: [review/production-forward-migration-package]
    paths:
      - "supabase/production-candidates/**"
      - "tests/production-migration-candidate-static.mjs"
      - ".github/workflows/production-migration-candidate-static.yml"

permissions:
  contents: read

jobs:
  static-safety-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/production-migration-candidate-static.mjs
