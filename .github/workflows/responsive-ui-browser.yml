name: Responsive landing browser checks

on:
  push:
    branches:
      - codex/fix-registration-confirmation-role
    paths:
      - "campusshield-brand-system.css"
      - "assets/campusshield-logo.svg"
      - "icons/campusshield.svg"
      - "icons/*.png"
      - "manifest.webmanifest"
      - "service-worker.js"
      - "index.html"
      - "campusshield-app.js"
      - "campusshield-backend.js"
      - "campusshield-visual-refresh.css"
      - "campus-dashboard-upgrade.js"
      - "campusshield-lovable-ux.css"
      - "campusshield-lovable-ux.js"
      - "supabase/migrations/20261108010000_campus_network_hub.sql"
      - "tests/campus-network-hub-smoke.mjs"
      - "campusshield-i18n.js"
      - "privacy.html"
      - "terms.html"
      - "contact.html"
      - "about.html"
      - "features.html"
      - "help.html"
      - "about.html"
      - "features.html"
      - "help.html"
      - "playwright.config.cjs"
      - "tests/browser/**"
      - ".github/workflows/responsive-ui-browser.yml"
  pull_request:
    branches: [main]
    paths:
      - "campusshield-brand-system.css"
      - "assets/campusshield-logo.svg"
      - "icons/campusshield.svg"
      - "icons/*.png"
      - "manifest.webmanifest"
      - "service-worker.js"
      - "index.html"
      - "campusshield-app.js"
      - "campusshield-backend.js"
      - "campusshield-visual-refresh.css"
      - "supabase/migrations/20261108010000_campus_network_hub.sql"
      - "tests/campus-network-hub-smoke.mjs"
      - "campusshield-i18n.js"
      - "privacy.html"
      - "terms.html"
      - "contact.html"
      - "about.html"
      - "features.html"
      - "help.html"
      - "playwright.config.cjs"
      - "tests/browser/**"
      - ".github/workflows/responsive-ui-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: campusshield-responsive-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  responsive-browser:
    name: Browser layout and access checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser-test dependency
        run: npm install --no-save --no-package-lock @playwright/test@1.64.1 @axe-core/playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check CampusShield application syntax
        run: |
          node --check campusshield-app.js
          node --check campusshield-backend.js

      - name: Check Campus Network and campus directory privacy contracts
        run: node tests/campus-network-hub-smoke.mjs

      - name: Run responsive browser tests
        env:
          CI: "true"
        run: npx playwright test --config=playwright.config.cjs

      - name: Upload responsive screenshots and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campusshield-responsive-ui-evidence
          path: |
            test-results/responsive/*.png
            test-results/playwright/
            playwright-report/
          if-no-files-found: warn
          retention-days: 7
