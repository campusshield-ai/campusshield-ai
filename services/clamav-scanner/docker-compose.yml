services:
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    # Do not publish clamd's TCP port to the host or the public internet.
    expose:
      - "3310"
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 3"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  scanner-api:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8080"
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
      MALWARE_SCANNER_TOKEN: ${MALWARE_SCANNER_TOKEN:?Set MALWARE_SCANNER_TOKEN in the deployment environment}
    expose:
      - "8080"
    depends_on:
      clamav:
        condition: service_healthy
